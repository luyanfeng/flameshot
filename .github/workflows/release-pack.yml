name: Release

on:
  workflow_run:
    workflows: ["Packaging(Windows)"]
    types: [completed]
    branches:
      - master
      - fix*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Collect artifacts and publish Release
    # 只由 Packaging(Windows) 的完成事件触发一次（Linux 上 flatpak 在 fork 上必败，
    # 触发不了 success 事件；Windows 成功时 Linux 的 deb/AppImage 也已出结果）。
    # 手动触发 (workflow_dispatch) 永远可用。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.name == 'Packaging(Windows)')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute version info
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 优先取上游 workflow run 的提交，手动触发用当前 checkout 的 sha
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA=$(git rev-parse --short "$SHA")

          # 版本号规则与打包 workflow 一致：取最近 tag，去掉 v 前缀
          LAST_TAG=$(git tag -l --sort=-v:refname | head -1)
          VERSION="${LAST_TAG#v}"

          REVNO=$(git rev-list "${LAST_TAG}..${SHA}" --count)
          VER_INFO="${VERSION}+git${REVNO}.${SHORT_SHA}"

          echo "version=${VERSION}"      >> "$GITHUB_OUTPUT"
          echo "ver_info=${VER_INFO}"    >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"              >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"  >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION} VER_INFO=${VER_INFO} SHA=${SHA}"

      - name: Download all artifacts of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.ver.outputs.sha }}"
          mkdir -p dist
          # 等待该 commit 的两个打包 workflow 全部出结果（Windows 先完成时 Linux 可能仍在跑）。
          # 注意 gh 不支持两个 --workflow，需分开查询。
          for i in $(seq 1 60); do
            PENDING=0
            for WF in "Packaging(Linux)" "Packaging(Windows)"; do
              N=$(gh run list -R "${GITHUB_REPOSITORY}" \
                --workflow="$WF" --branch master \
                --json status,headSha \
                -q "[.[] | select(.headSha==\"$SHA\" and .status!=\"completed\")] | length" 2>/dev/null || echo 0)
              PENDING=$((PENDING + N))
            done
            [ "$PENDING" = "0" ] && break
            echo "还有 $PENDING 个打包 run 未完成，等待 60s..."
            sleep 60
          done

          # 下载该 commit 已成功 run 的全部 artifacts。必需：Linux（deb+AppImage）、
          # Windows（msi/zip）。flatpak 在 fork 上必然失败（manifest 源码写死上游 repo），
          # 会拖垮整个 Linux run，因此只要 run 的核心 job 成功就采用其产物：
          # 优先找 success 的 run；找不到则退而求其次，找含成功 deb/appimage job 的 run。
          ok=false
          for WF in "Packaging(Linux)" "Packaging(Windows)"; do
            RUN_ID=$(gh run list -R "${GITHUB_REPOSITORY}" \
              --workflow="$WF" --status success --limit 20 \
              --json databaseId,headSha \
              -q ".[] | select(.headSha==\"$SHA\") | .databaseId" | head -1)
            if [ -z "$RUN_ID" ] && [ "$WF" = "Packaging(Linux)" ]; then
              # fork 上 flatpak 必败 → Linux run conclusion 是 failure，
              # 但 deb/appimage/rpm/snap job 都成功，产物有效
              RUN_ID=$(gh run list -R "${GITHUB_REPOSITORY}" \
                --workflow="$WF" --limit 20 \
                --json databaseId,headSha,conclusion \
                -q ".[] | select(.headSha==\"$SHA\" and .conclusion==\"failure\") | .databaseId" | head -1)
              if [ -n "$RUN_ID" ]; then
                echo "NOTE: Linux run 为 failure（fork 上 flatpak 已知必败），仍采用其 deb/AppImage 产物"
              fi
            fi
            if [ -z "$RUN_ID" ]; then
              echo "WARNING: no run of '$WF' for $SHA, skip"
              continue
            fi
            echo "Downloading artifacts of $WF run $RUN_ID"
            gh run download "$RUN_ID" -R "${GITHUB_REPOSITORY}" -D dist_raw || true
            ok=true
          done
          [ "$ok" = "true" ] || { echo "没有任何可用的打包 run"; exit 1; }
          # 展平目录结构（gh run download 会按 artifact 名建目录）
          find dist_raw -type f -print0 | while IFS= read -r -d '' f; do
            cp -v "$f" dist/
          done
          echo "=== dist 内容 ==="
          ls -la dist/

      - name: Verify required artifacts present
        run: |
          set -euo pipefail
          cd dist
          echo "=== 产物清单 ==="
          ls -la
          # 校验用户要求的关键产物是否齐全（ubuntu 24.04/26.04、debian13、appimage、win）
          missing=0
          for pat in \
            "*ubuntu-24.04.amd64.deb" \
            "*ubuntu-24.04.arm64.deb" \
            "*ubuntu-26.04.amd64.deb" \
            "*ubuntu-26.04.arm64.deb" \
            "*debian-13.amd64.deb" \
            "*.x86_64.AppImage" \
            "*-win64.msi" \
            "*-win64.zip"; do
            count=$(ls $pat 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "WARNING: 缺少 $pat"
              missing=$((missing+1))
            else
              echo "OK: $pat ($count)"
            fi
          done
          # 核心产物（Linux deb + AppImage + Windows）缺一个即失败
          if [ "$missing" -gt 0 ]; then
            echo "ERROR: 有 $missing 类核心产物缺失"
            exit 1
          fi

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          VER_INFO: ${{ steps.ver.outputs.ver_info }}
          SHORT_SHA: ${{ steps.ver.outputs.short_sha }}
        run: |
          set -euo pipefail
          TAG="v${VER_INFO}"
          TITLE="Flameshot ${TAG}"

          NOTES=$(cat <<'EON'
          ## Downloads

          ### Linux
          - **Ubuntu 24.04 / 26.04** (amd64 / arm64): `flameshot-*.ubuntu-24.04.*.deb`, `flameshot-*.ubuntu-26.04.*.deb`
          - **Debian 13**: `flameshot-*.debian-13.*.deb`
          - **AppImage** (x86_64, 捆绑 Qt 翻译): `Flameshot-*.x86_64.AppImage`
          - Fedora rpm / snap / flatpak: 见对应产物

          ### Windows 10 / 11 (x64)
          - **安装包 (MSI)**: `Flameshot-*-win64.msi`
          - **便携版 (ZIP)**: `flameshot-*-win64.zip`

          校验：每个包附带 `.sha256sum`。

          本构建包含以下分支修复：
          - GNOME Wayland mixed-DPI 截图重复缩放修复
          - `-p` 参数下 pin 按钮误隐藏修复
          - AppImage 翻译路径修复（AppImage 自带中文，含 Qt 官方翻译）
          EON
          )

          # 若 release 已存在则删除重建，保证幂等（同 commit 重跑）
          if gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，删除后重建（幂等）"
            gh release delete "$TAG" -R "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            -R "${GITHUB_REPOSITORY}" \
            --target "${SHA}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            dist/*

          echo "=== Release $TAG 发布完成 ==="
          gh release view "$TAG" -R "${GITHUB_REPOSITORY}"
